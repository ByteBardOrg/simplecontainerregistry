http:
  address: "0.0.0.0"
  port: 5000
  secureCookies: true
  publicURL: ""
  trustForwardedHeaders: false

storage:
  rootDirectory: "/var/lib/scr/registry"
  gc: true
  gcDelay: "1h"
  gcInterval: "24h"

database:
  driver: "sqlite"
  dsn: "/var/lib/scr/scr.db"

auth:
  issuer: "scr"
  service: "scr"
  tokenTTL: "10m"
