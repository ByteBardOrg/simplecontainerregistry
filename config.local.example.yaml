http:
  # Loopback only. Plain HTTP and insecure cookies need no opt-in here because
  # the listener is unreachable from outside this machine. Change this address
  # and you must set an https publicURL or allowInsecureHTTP: true.
  address: "127.0.0.1"
  port: 5000
  # Set true when accessing SCR through HTTPS, including an HTTPS-terminating reverse proxy.
  secureCookies: false
  allowInsecureHTTP: false
  publicURL: ""
  trustForwardedHeaders: false
  trustedProxyCIDRs: []
  readTimeout: "30m"
  writeTimeout: "30m"
  idleTimeout: "2m"
  maxHeaderBytes: 1048576

storage:
  rootDirectory: "data/registry"
  gc: true
  gcDelay: "1h"
  gcInterval: "24h"
  maxUploadBytes: 10737418240
  maxUploadSessions: 100
  uploadTTL: "24h"

database:
  driver: "sqlite"
  dsn: "data/scr.db"

auth:
  issuer: "scr"
  service: "scr"
  tokenTTL: "10m"

# Prefer environment variables for real deployments:
# SCR_BOOTSTRAP_ADMIN_USERNAME
# SCR_BOOTSTRAP_ADMIN_PASSWORD
# bootstrap:
#   adminUsername: "admin"
#   adminPassword: "change-me"
